name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: API - Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sistema_proveedores_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: apps/api
        run: npx eslint src --ext .ts

      - name: Build API
        run: npm run build:api

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Run migrations
        working-directory: apps/api
        run: npm run db:migrate
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_proveedores_test

      - name: Run tests
        working-directory: apps/api
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_proveedores_test
          JWT_SECRET: test_secret
          REFRESH_TOKEN_SECRET: test_refresh_secret
          PORT: 3000

      - name: Smoke test API image
        run: |
          docker build -f apps/api/Dockerfile.dev -t sistema-proveedores-api:ci .
          container=$(docker run --rm -d -p 127.0.0.1:3000:3000 sistema-proveedores-api:ci)
          trap 'docker stop "$container" >/dev/null' EXIT
          if ! curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/health; then
            docker logs "$container"
            exit 1
          fi
